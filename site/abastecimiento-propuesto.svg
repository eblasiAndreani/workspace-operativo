<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
  <title id="title">Flujo propuesto de generación de sugerencia de compra</title>
  <desc id="desc">El modelo recupera recepciones históricas, recepciones y stock de Databricks. Solicita las reglas a Abastecimiento API, que las consulta en SQL y se las devuelve. El modelo calcula la sugerencia y la escribe directamente en la tabla de control de la base de datos, sin pasar por la API.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#52627a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .group { stroke-width: 2; }
      .source-group { fill: #f8fafc; stroke: #94a3b8; }
      .api-group { fill: #eef2ff; stroke: #6366f1; }
      .db-group { fill: #f5f3ff; stroke: #8b5cf6; }
      .model-group { fill: #fff7f7; stroke: #ef4444; }
      .result-group { fill: #fffbeb; stroke: #f59e0b; }
      .title { font-size: 19px; font-weight: 700; fill: #334155; }
      .node { stroke-width: 2; }
      .source-node { fill: #fff; stroke: #64748b; }
      .api-node { fill: #e0e7ff; stroke: #6366f1; }
      .db-node { fill: #ede9fe; stroke: #8b5cf6; }
      .model-node { fill: #fee2e2; stroke: #ef4444; }
      .result-node { fill: #fef3c7; stroke: #f59e0b; }
      .label { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 14px; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #52627a; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .edge-data { stroke: #64748b; }
      .edge-api { stroke: #4f46e5; }
      .edge-db { stroke: #7c3aed; }
      .edge-result { stroke: #d97706; }
      .edge-label { font-size: 12px; font-weight: 650; fill: #475569; text-anchor: middle; }
      .step { fill: #4338ca; }
      .step-text { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="group source-group" x="24" y="126" width="300" height="400" rx="16"/>
  <text class="title" x="48" y="164">Databricks</text>
  <rect class="node source-node" x="50" y="190" width="248" height="70" rx="10"/>
  <text class="label" x="174" y="220">Recepciones históricas</text>
  <text class="detail" x="174" y="242">Datos de entrada</text>
  <rect class="node source-node" x="50" y="282" width="248" height="70" rx="10"/>
  <text class="label" x="174" y="312">Recepciones</text>
  <text class="detail" x="174" y="334">Datos de entrada</text>
  <rect class="node source-node" x="50" y="374" width="248" height="70" rx="10"/>
  <text class="label" x="174" y="404">Maestro de stock</text>
  <text class="detail" x="174" y="426">Datos de entrada</text>

  <rect class="group model-group" x="420" y="126" width="360" height="400" rx="16"/>
  <text class="title" x="444" y="164">Modelo matemático</text>
  <rect class="node model-node" x="452" y="220" width="296" height="110" rx="12"/>
  <text class="label" x="600" y="258">Combina datos y reglas</text>
  <text class="detail" x="600" y="284">Calcula la sugerencia</text>
  <rect class="node result-node" x="472" y="390" width="256" height="76" rx="12"/>
  <text class="label" x="600" y="428">Sugerencia calculada</text>

  <rect class="group api-group" x="900" y="126" width="290" height="400" rx="16"/>
  <text class="title" x="924" y="164">Servicio</text>
  <rect class="node api-node" x="926" y="260" width="238" height="130" rx="14"/>
  <text class="label" x="1045" y="301">Abastecimiento API</text>
  <text class="detail" x="1045" y="332">Consulta y devuelve reglas</text>
  <text class="detail" x="1045" y="355">Devuelve la sugerencia</text>

  <rect class="group db-group" x="1300" y="126" width="216" height="400" rx="16"/>
  <text class="title" x="1324" y="164">Reglas</text>
  <rect class="node db-node" x="1320" y="260" width="176" height="130" rx="14"/>
  <text class="label" x="1408" y="301">Base SQL</text>
  <text class="detail" x="1408" y="332">Proveedores</text>
  <text class="detail" x="1408" y="355">y materiales</text>

  <rect class="group db-group" x="1080" y="570" width="436" height="130" rx="16"/>
  <text class="title" x="1104" y="604">Base de datos · Tabla de control</text>
  <rect class="node result-node" x="1112" y="622" width="372" height="52" rx="12"/>
  <text class="label" x="1298" y="654">Sugerencia de compra guardada</text>

  <path class="edge edge-data" d="M324 290 H452"/>
  <text class="edge-label" x="388" y="310">Recupera datos</text>

  <path class="edge edge-api" d="M748 220 H820 V272 H926"/>
  <circle class="step" cx="820" cy="204" r="11"/>
  <text class="step-text" x="820" y="204">1</text>
  <text class="edge-label" x="844" y="253">Solicita reglas</text>

  <path class="edge edge-api" d="M926 368 H820 V308 H748"/>
  <circle class="step" cx="820" cy="392" r="11"/>
  <text class="step-text" x="820" y="392">4</text>
  <text class="edge-label" x="838" y="346">Devuelve reglas</text>

  <path class="edge edge-db" d="M1164 278 H1320"/>
  <circle class="step" cx="1242" cy="260" r="11"/>
  <text class="step-text" x="1242" y="260">2</text>
  <text class="edge-label" x="1242" y="298">Consulta reglas</text>

  <path class="edge edge-db" d="M1320 370 H1164"/>
  <circle class="step" cx="1242" cy="390" r="11"/>
  <text class="step-text" x="1242" y="390">3</text>
  <text class="edge-label" x="1242" y="415">Devuelve reglas</text>

  <path class="edge edge-api" d="M600 330 V390"/>
  <text class="edge-label" x="600" y="362">Calcula resultado</text>

  <path class="edge edge-result" d="M600 466 V648 H1112"/>
  <text class="edge-label" x="830" y="632">El modelo escribe directamente · Sin pasar por la API</text>
  <text class="detail" x="770" y="734">El flujo termina con la sugerencia guardada en la tabla de control.</text>
</svg>
