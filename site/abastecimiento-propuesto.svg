<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 990" role="img" aria-labelledby="title desc">
  <title id="title">Sugerencia de compra: lectura y escritura directa en SQL</title>
  <desc id="desc">El modelo lee reglas de proveedores y materiales de SQL, recupera datos de Databricks y escribe la sugerencia en la tabla de control de la misma base. Abastecimiento API permite CRUD de las reglas y devuelve maestros actualizados de tiendas, materiales y proveedores desde Gobierno. El modelo accede directamente a SQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rules" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-result" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-api" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#4338ca"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .group { stroke-width: 2; }
      .source { fill: #f8fafc; stroke: #94a3b8; }
      .model { fill: #fff7f7; stroke: #ef4444; }
      .sql { fill: #f5f3ff; stroke: #8b5cf6; }
      .api { fill: #eef2ff; stroke: #6366f1; }
      .node { stroke-width: 2; }
      .input { fill: #fff; stroke: #94a3b8; }
      .calculation { fill: #fee2e2; stroke: #ef4444; }
      .rules { fill: #ede9fe; stroke: #8b5cf6; }
      .result { fill: #fef3c7; stroke: #f59e0b; }
      .title { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 14px; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
      .data-edge { stroke: #64748b; marker-end: url(#arrow); }
      .rules-edge { stroke: #6d28d9; marker-end: url(#arrow-rules); }
      .result-edge { stroke: #b45309; marker-end: url(#arrow-result); }
      .crud-edge { stroke: #4338ca; marker-start: url(#arrow-api); marker-end: url(#arrow-api); }
      .masters-edge { stroke: #4338ca; marker-end: url(#arrow-api); }
      .edge-label { font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect class="group source" x="24" y="70" width="300" height="490" rx="16"/>
  <text class="title" x="48" y="111">Databricks</text>
  <text class="detail" x="174" y="141">Datos recuperados por el modelo</text>
  <rect class="node input" x="50" y="180" width="248" height="70" rx="10"/>
  <text class="label" x="174" y="222">Recepciones históricas</text>
  <rect class="node input" x="50" y="280" width="248" height="70" rx="10"/>
  <text class="label" x="174" y="322">Recepciones</text>
  <rect class="node input" x="50" y="380" width="248" height="70" rx="10"/>
  <text class="label" x="174" y="422">Maestro de stock</text>

  <rect class="group model" x="450" y="70" width="360" height="490" rx="16"/>
  <text class="title" x="478" y="111">Modelo matemático</text>
  <text class="detail" x="630" y="141">En cada ejecución</text>
  <rect class="node calculation" x="480" y="195" width="300" height="155" rx="12"/>
  <text class="label" x="630" y="252">Combina datos y reglas</text>
  <text class="detail" x="630" y="285">Mismo procesamiento</text>
  <text class="detail" x="630" y="312">Calcula la sugerencia</text>
  <rect class="node result" x="480" y="410" width="300" height="90" rx="12"/>
  <text class="label" x="630" y="462">Sugerencia calculada</text>

  <rect class="group sql" x="1050" y="70" width="466" height="490" rx="16"/>
  <text class="title" x="1078" y="111">Una misma base SQL</text>
  <text class="detail" x="1283" y="141">Tres entidades · Lectura y escritura directa</text>
  <rect class="node rules" x="1080" y="180" width="406" height="70" rx="10"/>
  <text class="label" x="1283" y="209">Proveedores</text>
  <text class="detail" x="1283" y="232">Reglas que lee el modelo</text>
  <rect class="node rules" x="1080" y="280" width="406" height="70" rx="10"/>
  <text class="label" x="1283" y="309">Materiales</text>
  <text class="detail" x="1283" y="332">Reglas que lee el modelo</text>
  <rect class="node result" x="1080" y="410" width="406" height="90" rx="10"/>
  <text class="label" x="1283" y="447">Tabla de control</text>
  <text class="detail" x="1283" y="474">Sugerencia de compra guardada</text>

  <path class="edge data-edge" d="M298 215 H350 V240 H480"/>
  <path class="edge data-edge" d="M298 315 H350 V272 H480"/>
  <path class="edge data-edge" d="M298 415 H370 V305 H480"/>
  <text class="edge-label" x="388" y="192">Recupera datos</text>

  <path class="edge rules-edge" d="M1080 215 H780"/>
  <text class="edge-label" x="930" y="199">Lee proveedores</text>
  <path class="edge rules-edge" d="M1080 315 H780"/>
  <text class="edge-label" x="930" y="299">Lee materiales</text>

  <path class="edge result-edge" d="M630 350 V410"/>
  <text class="edge-label" x="690" y="385">Resultado</text>
  <path class="edge result-edge" d="M780 455 H1080"/>
  <text class="edge-label" x="930" y="436">Escribe la sugerencia</text>
  <text class="detail" x="930" y="484">Directamente en la misma base</text>

  <text class="detail" x="770" y="610">El modelo accede directamente a SQL. El cálculo termina con la sugerencia guardada en la tabla de control.</text>

  <rect class="group source" x="24" y="710" width="510" height="210" rx="16"/>
  <text class="title" x="50" y="753">Gobierno</text>
  <text class="label" x="279" y="800">Maestros actualizados</text>
  <text class="detail" x="279" y="838">Tiendas · Materiales · Proveedores</text>
  <text class="detail" x="279" y="878">Origen de los maestros</text>

  <rect class="group api" x="1050" y="710" width="466" height="210" rx="16"/>
  <text class="title" x="1078" y="753">Abastecimiento API</text>
  <rect class="node api" x="1080" y="775" width="406" height="120" rx="12"/>
  <text class="label" x="1283" y="809">CRUD de reglas</text>
  <text class="detail" x="1283" y="837">Crear · Consultar · Modificar · Eliminar</text>
  <text class="detail" x="1283" y="873">Devuelve los maestros de Gobierno</text>

  <path class="edge masters-edge" d="M534 850 H1080"/>
  <text class="edge-label" x="807" y="812">Maestros actualizados</text>
  <text class="detail" x="807" y="835">Tiendas · Materiales · Proveedores</text>

  <path class="edge crud-edge" d="M1486 805 H1590 V215 H1486"/>
  <text class="edge-label" x="1590" y="620">CRUD</text>
  <text class="detail" x="1590" y="645">Proveedores</text>
  <path class="edge crud-edge" d="M1486 865 H1680 V315 H1486"/>
  <text class="edge-label" x="1680" y="690">CRUD</text>
  <text class="detail" x="1680" y="715">Materiales</text>

  <text class="detail" x="770" y="963">Las reglas en SQL y los maestros de Gobierno son conceptos distintos. No se representa sincronización entre ambos.</text>
</svg>
