<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Flujo propuesto de generación de sugerencia de compra</title>
  <desc id="desc">El modelo toma datos de Databricks y solicita las reglas de proveedores y materiales a Abastecimiento API. La API consulta SQL, devuelve las reglas al modelo y este calcula la sugerencia de compra.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#52627a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .group { stroke-width: 2; }
      .source-group { fill: #f8fafc; stroke: #94a3b8; }
      .service-group { fill: #eef2ff; stroke: #6366f1; }
      .db-group { fill: #f5f3ff; stroke: #8b5cf6; }
      .model-group { fill: #fff7f7; stroke: #ef4444; }
      .result-group { fill: #fffbeb; stroke: #f59e0b; }
      .title { font-size: 20px; font-weight: 700; fill: #334155; }
      .node { stroke-width: 2; }
      .source-node { fill: #fff; stroke: #64748b; }
      .service-node { fill: #e0e7ff; stroke: #6366f1; }
      .db-node { fill: #ede9fe; stroke: #8b5cf6; }
      .model-node { fill: #fee2e2; stroke: #ef4444; }
      .result-node { fill: #fef3c7; stroke: #f59e0b; }
      .label { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 14px; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #52627a; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .edge-data { stroke: #64748b; }
      .edge-rules { stroke: #4f46e5; }
      .edge-sql { stroke: #7c3aed; }
      .edge-label { font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .step { fill: #4338ca; }
      .step-text { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="group source-group" x="24" y="170" width="310" height="300" rx="16"/>
  <text class="title" x="48" y="207">Datos de Databricks</text>
  <rect class="node source-node" x="52" y="230" width="254" height="58" rx="10"/>
  <text class="label" x="179" y="265">Recepciones históricas</text>
  <rect class="node source-node" x="52" y="306" width="254" height="58" rx="10"/>
  <text class="label" x="179" y="341">Recepciones</text>
  <rect class="node source-node" x="52" y="382" width="254" height="58" rx="10"/>
  <text class="label" x="179" y="417">Maestro de stock</text>

  <rect class="group model-group" x="410" y="170" width="340" height="300" rx="16"/>
  <text class="title" x="434" y="207">Modelo de abastecimiento</text>
  <rect class="node model-node" x="445" y="245" width="270" height="82" rx="12"/>
  <text class="label" x="580" y="277">Combina datos y reglas</text>
  <text class="detail" x="580" y="302">y calcula la sugerencia</text>
  <rect class="node result-node" x="465" y="365" width="230" height="70" rx="12"/>
  <text class="label" x="580" y="407">Sugerencia de compra</text>

  <rect class="group service-group" x="830" y="170" width="270" height="300" rx="16"/>
  <text class="title" x="854" y="207">Servicio</text>
  <rect class="node service-node" x="855" y="265" width="220" height="120" rx="14"/>
  <text class="label" x="965" y="307">Abastecimiento API</text>
  <text class="detail" x="965" y="336">Intermedia el acceso</text>
  <text class="detail" x="965" y="358">a las reglas</text>

  <rect class="group db-group" x="1180" y="170" width="236" height="300" rx="16"/>
  <text class="title" x="1202" y="207">Reglas</text>
  <rect class="node db-node" x="1202" y="265" width="192" height="120" rx="14"/>
  <text class="label" x="1298" y="307">Base SQL</text>
  <text class="detail" x="1298" y="336">Proveedores</text>
  <text class="detail" x="1298" y="358">y materiales</text>

  <path class="edge edge-data" d="M334 320 H445"/>
  <text class="edge-label" x="389" y="306">Datos</text>

  <path class="edge edge-rules" d="M715 250 H770 V294 H855"/>
  <circle class="step" cx="771" cy="238" r="12"/>
  <text class="step-text" x="771" y="238">1</text>
  <text class="edge-label" x="790" y="278">Solicita reglas</text>

  <path class="edge edge-rules" d="M855 365 H785 V430 H715"/>
  <circle class="step" cx="785" cy="450" r="12"/>
  <text class="step-text" x="785" y="450">4</text>
  <text class="edge-label" x="786" y="413">Devuelve reglas</text>

  <path class="edge edge-sql" d="M1075 295 H1202"/>
  <circle class="step" cx="1137" cy="281" r="12"/>
  <text class="step-text" x="1137" y="281">2</text>
  <text class="edge-label" x="1138" y="318">Consulta reglas</text>

  <path class="edge edge-sql" d="M1202 365 H1075"/>
  <circle class="step" cx="1137" cy="383" r="12"/>
  <text class="step-text" x="1137" y="383">3</text>
  <text class="edge-label" x="1138" y="410">Retorna reglas</text>

  <path class="edge edge-rules" d="M580 327 V365"/>
  <text class="edge-label" x="580" y="352">Calcula</text>

  <text class="detail" x="720" y="530">El flujo termina al generar la sugerencia de compra.</text>
</svg>
